name: AYZEN Security

on:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --audit-level high
      - name: Secret pattern scan
        run: |
          ! rg -n --hidden --glob '!pnpm-lock.yaml' --glob '!.git/**' \
            '(BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|AKIA[0-9A-Z]{16})' .
      - name: JavaScript syntax scan
        run: node scripts/src/check-all.ts --syntax-only
      - run: node scripts/validate-domain-boundaries.mjs