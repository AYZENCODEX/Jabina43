name: Reusable service validation

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string

permissions:
  contents: read

jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "${{ inputs.service }}" build
      - run: docker build --file "${{ inputs.service }}/Dockerfile" .
      - run: node scripts/validate-cloud-phases.mjs