name: AYZEN Release

on:
  workflow_dispatch:
    inputs:
      release_id:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  promotion-gate:
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.image.outputs.IMAGE_DIGEST }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:product-readiness-1-40
      - run: node scripts/release-manifest.mjs
      - id: image
        name: Build immutable release image
        run: |
          docker build \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --tag "ayzen:${GITHUB_SHA}" .
          echo "IMAGE_DIGEST=$(docker image inspect --format='{{.Id}}' "ayzen:${GITHUB_SHA}")" >> "$GITHUB_OUTPUT"
      - name: Generate provenance and SBOM
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ayzen:release-${{ inputs.release_id }}
          provenance: true
          sbom: true

  rollback-drill:
    needs: promotion-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "IMAGE_DIGEST=${{ needs.promotion-gate.outputs.image_digest }}"
      - run: node scripts/backup-restore-check.mjs