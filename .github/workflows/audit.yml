name: AYZEN Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/full-system-audit.mjs
      - run: pnpm validate:contract-exceptions
      - run: pnpm validate:ui-circuit
      - run: pnpm validate:enforcement