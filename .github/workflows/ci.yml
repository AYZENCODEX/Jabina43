name: AYZEN CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  affected:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.affected.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - id: affected
        run: |
          echo 'services=["workspace"]' >> "$GITHUB_OUTPUT"

  validation:
    needs: affected
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.affected.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/validate-phase-1-15.mjs
      - run: node scripts/validate-phase-16-25.mjs
      - run: node scripts/validate-platform-phases.mjs
      - run: node scripts/validate-maturity-phases.mjs
      - run: pnpm validate:product-readiness-1-40

  build:
    needs: validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build